<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Accès protégé</title>
<style>
:root{--bg:#f4f5f8;--surface:#fff;--ink:#15171f;--muted:#5b6172;--line:#dfe2ea;--accent:#3d4ee0;--accent-ink:#fff;--bad:#c0392b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#101217;--surface:#181b23;--ink:#eceef4;--muted:#9aa1b3;--line:#2a2f3b;--accent:#8b97ff;--accent-ink:#10121a;--bad:#ff7b6b;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font:400 15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
form{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:22px;line-height:1.2}
p{margin:0;color:var(--muted)}
label{font-size:13px;font-weight:500;color:var(--muted)}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:500 15px system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:var(--bad);font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<form id="f">
  <h1>Focus group synthétique</h1>
  <p>Accès protégé. Saisissez le mot de passe pour ouvrir l'outil.</p>
  <label for="pw">Mot de passe</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus required>
  <button type="submit" id="go">Ouvrir</button>
  <p id="err" role="alert" hidden></p>
</form>
<script>
(function(){
"use strict";
var P=__PAYLOAD__;
var form=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),go=document.getElementById("go");

function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
async function decrypt(password){
  var material=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
  var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},material,{name:"AES-GCM",length:256},false,["decrypt"]);
  var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  return new TextDecoder().decode(plain);
}
function open(html){document.open();document.write(html);document.close()}
function fail(msg){err.textContent=msg;err.hidden=false;go.disabled=false;pw.focus();pw.select()}

async function attempt(password,silent){
  if(!window.crypto||!crypto.subtle){if(!silent)fail("Ce navigateur ne permet pas le déchiffrement. Ouvrez la page en HTTPS.");return}
  go.disabled=true;err.hidden=true;
  var html;
  try{html=await decrypt(password)}
  catch(e){
    go.disabled=false;
    try{sessionStorage.removeItem("fgs.pw")}catch(x){}
    if(!silent)fail("Mot de passe incorrect.");
    return;
  }
  try{sessionStorage.setItem("fgs.pw",password)}catch(x){}
  open(html);
}
form.addEventListener("submit",function(e){e.preventDefault();attempt(pw.value,false)});
try{var saved=sessionStorage.getItem("fgs.pw");if(saved)attempt(saved,true)}catch(e){}
})();
</script>
</body>
</html>
